name: ci

# Fast gate on every push/PR: prose lint + production build. Deploys happen
# only in release.yml (GitHub Release published), never from here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm text:gate
      - run: pnpm build
